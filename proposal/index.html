<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>True Jesus Church Sabah | Gereja Yesus Benar Sabah | 沙巴真耶稣教会 (prototype)</title>
<meta name="theme-color" content="#313131">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,700;1,400&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
:root{--navy:#305088;--sky:#00AFF2;--char:#313131;--ink:#404040;--grey:#767676;--light:#F4F7FA;--line:#E5E5E5;--red:#C62828;
--wc:#305088;--int:#3A9E5C;--ec:#00A3E0;--lb:#8A6BBE;--sw:#D9822B}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Roboto Condensed','Noto Sans SC','Arial Narrow',Arial,sans-serif;color:var(--ink);font-size:16px;line-height:1.55;background:#fff}
body.zh{font-family:'Noto Sans SC','Roboto Condensed',sans-serif;font-size:15.5px}
a{color:var(--sky)}
img{max-width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
/* proposal banner */
#proto{background:#FFF4D6;color:#5C4400;font-size:13px;padding:6px 0;border-bottom:1px solid #F0D68A}
#proto .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#proto b{color:#5C4400}#proto a{color:#7A5A00;font-weight:700}
#proto .sp{flex:1}
/* top bar like their site */
#topbar{background:var(--char);color:#fff;font-size:12.5px}
#topbar .wrap{display:flex;gap:16px;align-items:center;height:32px}
#topbar .sp{flex:1}
.lang{display:flex;gap:2px}
.lang button{background:transparent;border:0;color:#ddd;font:inherit;font-size:12.5px;font-weight:700;padding:4px 9px;cursor:pointer;border-radius:3px;letter-spacing:.4px}
.lang button.on{background:var(--sky);color:#fff}
.lang button:hover:not(.on){color:var(--sky)}
#topbar a{color:#ddd;text-decoration:none}#topbar a:hover{color:var(--sky)}
/* header */
header{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:50}
header .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;cursor:pointer}
.brand svg{flex:none}
.brand .t1{color:var(--navy);font-style:italic;font-size:15px;line-height:1.1}
.brand .t2{color:var(--sky);font-weight:700;font-size:20px;line-height:1.15;white-space:nowrap}
nav.main{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
nav.main a{color:var(--char);text-decoration:none;font-size:14.5px;padding:8px 10px;border-radius:3px;white-space:nowrap}
nav.main a:hover{color:var(--sky)}
nav.main a.on{color:var(--sky);box-shadow:inset 0 -3px 0 var(--sky);border-radius:0}
#burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:3px;padding:7px 10px;font:inherit;cursor:pointer}
@media(max-width:1240px){nav.main{display:none;position:absolute;left:0;right:0;top:100%;background:#fff;flex-direction:column;padding:8px 20px 14px;box-shadow:0 8px 12px rgba(0,0,0,.12)}nav.main.open{display:flex}nav.main a.on{box-shadow:inset 3px 0 0 var(--sky)}#burger{display:block}}
/* page */
main{min-height:60vh}
.page-h{background:var(--light);border-bottom:1px solid var(--line);padding:26px 0 20px}
.page-h h1{margin:0;color:#000;font-size:30px;text-transform:uppercase;letter-spacing:.3px;line-height:1.15}
body.zh .page-h h1{text-transform:none}
.page-h p{margin:8px 0 0;max-width:780px}
.crumb{font-size:13px;color:var(--grey);margin-bottom:6px}
.crumb a{color:var(--grey)}
section.blk{padding:30px 0}
h2.sec{font-size:22px;color:var(--navy);margin:0 0 14px;padding-bottom:6px;border-bottom:2px solid var(--sky);display:inline-block}
.btn{display:inline-block;background:var(--sky);color:#fff;text-decoration:none;font-weight:700;border:0;border-radius:3px;padding:10px 18px;cursor:pointer;font:inherit;font-weight:700}
.btn.navy{background:var(--navy)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px;text-decoration:none;color:var(--ink);display:block;transition:border-color .15s,box-shadow .15s}
a.card:hover{border-color:var(--sky);box-shadow:0 3px 12px rgba(0,0,0,.07)}
.card h3{margin:8px 0 4px;color:var(--navy);font-size:18px}
.card p{margin:0;font-size:14.5px;color:var(--grey)}
.ico{width:42px;height:42px;border-radius:50%;background:#E6F7FE;display:flex;align-items:center;justify-content:center}
/* hero */
.hero{position:relative;color:#fff;background:#223 center/cover no-repeat;min-height:400px;display:flex;align-items:flex-end}
.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(25,40,70,.88) 0%,rgba(25,40,70,.55) 55%,rgba(25,40,70,.15) 100%)}
.hero .wrap{position:relative;padding-top:60px;padding-bottom:44px;width:100%}
.hero .k{color:var(--sky);font-weight:700;letter-spacing:1px;font-size:15px}
.hero h1{font-size:clamp(32px,5.5vw,52px);margin:4px 0 6px;line-height:1.05;text-transform:uppercase}
body.zh .hero h1{text-transform:none}
.hero p{max-width:620px;font-size:17px;margin:0 0 20px;color:#E8EEF6}
.hero .cap{position:absolute;right:12px;bottom:8px;font-size:11px;color:#cfd8e3}
.stats{display:flex;gap:30px;flex-wrap:wrap;margin-top:22px}
.stats b{display:block;font-size:34px;color:var(--sky);line-height:1}.stats span{font-size:13px;color:#CFE3F5}
.vid{position:relative;padding-top:56.25%;border-radius:6px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.verse{background:var(--navy);color:#fff;text-align:center;padding:26px 20px;font-size:19px;font-style:italic}
/* beliefs */
.bel{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:760px){.bel{grid-template-columns:1fr}}
.bel .b{border:1px solid var(--line);border-radius:6px;padding:16px 16px 14px;display:flex;gap:14px;background:#fff}
.bel .n{flex:none;width:38px;height:38px;border-radius:50%;background:var(--sky);color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center}
.bel h3{margin:0 0 4px;color:var(--navy);font-size:18px}.bel p{margin:0;font-size:15px}
.bel .wv{margin-top:8px;font-size:13.5px;font-weight:700;color:var(--sky);background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal.on{display:flex}.modal .in{width:min(900px,100%)}.modal .x{display:block;margin:0 0 8px auto;background:#fff;border:0;border-radius:3px;padding:6px 12px;font:inherit;cursor:pointer}
/* timeline */
.tl{position:relative;margin:10px 0 0;padding-left:26px}
.tl:before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .e{position:relative;padding:0 0 16px}
.tl .e:before{content:'';position:absolute;left:-23px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--sky)}
.tl .y{font-weight:700;color:var(--navy);font-size:17px}
.story h3{color:var(--navy);margin:20px 0 4px;font-size:19px}.story p{margin:0}
/* org chart */
.oc{--ln:#9DB3D6;overflow-x:auto;padding:8px 0 4px}
.oc .lvl{display:flex;justify-content:center;gap:14px;position:relative;flex-wrap:wrap}
.oc .vline{width:2px;height:20px;background:var(--ln);margin:0 auto}
.node{background:#fff;border:2px solid var(--navy);border-radius:8px;padding:9px 14px;text-align:center;cursor:pointer;font-weight:700;color:var(--navy);font-size:15px;line-height:1.2;min-width:150px;max-width:260px;transition:background .15s,transform .1s;position:relative;font-family:inherit}
.node small{display:block;font-weight:400;color:var(--grey);font-size:12px;margin-top:2px}
.node:hover{background:#EAF7FE}
.node.sel{background:var(--navy);color:#fff}.node.sel small{color:#CFE3F5}
.node.top{border-color:var(--sky);font-size:18px;padding:12px 22px;box-shadow:0 2px 8px rgba(0,175,242,.25)}
.node.side{border-style:dashed;border-color:#9AA3AE;color:var(--char);font-weight:400;min-width:130px}
.node.dept{border-color:var(--sky)}
.node .tg{position:absolute;right:6px;top:4px;font-size:11px;color:var(--sky)}
.depts{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;position:relative;padding-top:20px}
.depts:before{content:'';position:absolute;top:0;left:8.33%;right:8.33%;height:2px;background:var(--ln)}
.depts>div{position:relative;display:flex;flex-direction:column;align-items:stretch}
.depts>div:before{content:'';position:absolute;top:-20px;left:50%;width:2px;height:20px;background:var(--ln)}
.depts .node{max-width:none;min-width:0}
.units{display:none;flex-direction:column;gap:6px;margin-top:8px;padding-left:10px;border-left:2px solid var(--ln)}
.units.on{display:flex}
.unit{background:var(--light);border-radius:4px;padding:6px 8px;font-size:13.5px;color:var(--char)}
@media(max-width:900px){.depts{grid-template-columns:repeat(2,1fr)}.depts:before{display:none}.depts>div:before{display:none}}
@media(max-width:520px){.depts{grid-template-columns:1fr}}
.ocrow{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.ocrow .l,.ocrow .r{display:flex;flex-direction:column;gap:8px}
.ocrow .l{align-items:flex-end}.ocrow .r{align-items:flex-start}
@media(max-width:700px){.ocrow{grid-template-columns:1fr}.ocrow .l,.ocrow .r{align-items:center}}
#ocd{border:1px solid var(--line);border-top:4px solid var(--sky);border-radius:6px;padding:18px 20px;margin-top:22px;background:#fff;scroll-margin-top:90px}
#ocd h3{margin:0 0 4px;color:var(--navy);font-size:21px}
#ocd .alt{color:var(--grey);font-size:13.5px;margin-bottom:10px}
#ocd ol{margin:6px 0 0;padding-left:22px}#ocd li{margin:3px 0}
#ocd .uc{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#ocd .uc span{background:#E6F7FE;color:var(--navy);border-radius:12px;padding:3px 10px;font-size:13.5px}
.octools{display:flex;gap:8px;justify-content:center;margin:4px 0 14px;flex-wrap:wrap}
.octools button{background:#fff;border:1px solid var(--line);border-radius:3px;padding:5px 12px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--navy)}
/* churches */
.ctools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ctools input{flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:3px;font:inherit}
.ctools input:focus{outline:none;border-color:var(--sky)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--char)}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chips .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.zband{color:#fff;font-weight:700;padding:8px 12px;border-radius:4px 4px 0 0;margin-top:22px;display:flex;justify-content:space-between}
.zband span{font-weight:400;font-size:13px}
.szh{font-size:13px;color:var(--grey);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin:14px 0 6px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cc{border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;background:#fff}
.cc .ph{flex:none;width:96px;background:#E9EDF2 center/cover no-repeat}
.cc .bd{padding:10px 12px;flex:1;min-width:0}
.cc h4{margin:0;color:var(--navy);font-size:17px}
.cc .ty{font-size:12.5px;color:var(--grey)}
.cc table{font-size:13px;border-collapse:collapse;margin:6px 0}
.cc td{padding:1px 8px 1px 0;vertical-align:top}.cc td:first-child{font-weight:700;white-space:nowrap}
.cc .kl{display:inline-block;font-weight:700;color:var(--sky);text-decoration:none;font-size:14px;margin-right:10px}
.cc .lk{font-size:13px;color:var(--navy)}
.cc .aw{color:var(--red);font-size:13px}
.atlas{border:1px solid var(--line);border-radius:6px;overflow:hidden;height:560px;position:relative}
.atlas iframe{border:0;width:100%;height:100%}
/* table */
table.ct{border-collapse:collapse;width:100%;max-width:720px}
table.ct td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.ct td:first-child{font-weight:700;color:var(--navy);width:200px}
.klcard{background:var(--char);color:#fff;border-radius:4px;border-top:4px solid var(--sky);padding:16px;display:flex;gap:16px;align-items:center;max-width:460px}
.klcard .v{font-size:26px;font-weight:700}.klcard .c{font-size:12px;color:#bbb;letter-spacing:.4px}
.klcard .qr{background:#fff;padding:8px;border-radius:6px}.klcard .qr svg{width:110px;height:110px;display:block}
/* news */
.en{display:flex;gap:14px;align-items:center}
.en img{width:72px;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.2);flex:none;background:var(--light);min-height:96px}
.en b{color:var(--navy)}.en .dt{font-size:13px;color:var(--grey)}
.plist a{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.plist .dt{flex:none;width:96px;color:var(--grey);font-size:14px}
.plist .tg{font-size:12px;color:var(--grey);border:1px solid var(--line);border-radius:10px;padding:0 7px;margin-left:6px;white-space:nowrap}
/* footer */
footer{background:var(--char);color:#ccc;margin-top:40px;font-size:14px}
footer .wrap{padding:28px 20px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px}
footer a{color:#ddd;text-decoration:none}footer a:hover{color:var(--sky)}
footer h4{color:#fff;margin:0 0 8px}
footer .bt{border-top:1px solid #444;text-align:center;padding:10px;font-size:12.5px;color:#999}
@media(max-width:760px){footer .wrap{grid-template-columns:1fr}}
/* review page */
.iss{border-collapse:collapse;width:100%;font-size:14.5px}
.iss th{text-align:left;background:var(--light);padding:8px;font-size:13px;color:var(--grey)}
.iss td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.sev{display:inline-block;font-size:11.5px;font-weight:700;border-radius:10px;padding:1px 8px;color:#fff}
.sev.h{background:var(--red)}.sev.m{background:#D9822B}.sev.l{background:#9AA3AE}
.fx{color:#2E7D32;font-weight:700}.fx.p{color:#B26A00}
</style>
</head>
<body>
<div id="proto"><div class="wrap"><b id="t-banner"></b><span class="sp"></span><a href="#/review" id="t-review"></a><a id="t-official" href="https://ga.tjcsabah.com/" target="_blank" rel="noopener"></a></div></div>
<div id="topbar"><div class="wrap"><div class="lang" role="group" aria-label="Language"><button data-l="en">ENGLISH</button><button data-l="ms">BAHASA MELAYU</button><button data-l="zh">中文</button></div><span class="sp"></span><a href="#/disclaimer" data-k="disclaimer"></a><a href="#/contact" data-k="contact"></a></div></div>
<header><div class="wrap">
  <a class="brand" href="#/home"><svg width="44" height="34" viewBox="0 0 44 34" aria-hidden="true"><path d="M2 20 C10 8 22 4 42 6 C30 9 22 14 18 22 C14 18 8 18 2 20Z" fill="#305088"/><path d="M14 24 C20 16 28 13 40 13 C30 17 25 22 23 30 C21 27 18 25 14 24Z" fill="#00AFF2"/></svg>
  <div><div class="t1">Gereja Yesus Benar</div><div class="t2" id="t-site"></div></div></a>
  <button id="burger" aria-label="Menu">&#9776;</button>
  <nav class="main" id="nav"></nav>
</div></header>
<main id="main"></main>
<div class="modal" id="vm" onclick="if(event.target===this)closeV()"><div class="in"><button class="x" onclick="closeV()">&times;</button><div class="vid" id="vmv"></div></div></div>
<footer><div class="wrap">
  <div><h4 id="f-site"></h4><div id="f-addr"></div><div id="f-note" style="margin-top:8px;color:#999"></div></div>
  <div id="f-nav1"></div><div id="f-nav2"></div>
</div><div class="bt">&copy; True Jesus Church Sabah &middot; <span id="f-proto"></span></div></footer>

<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="content.js"></script>
<script>
let L='en';try{const s=new URLSearchParams(location.search).get('lang')||localStorage.getItem('tjc-lang');if(['en','ms','zh'].includes(s))L=s}catch(e){}
const t=o=>o==null?'':(typeof o==='string'?o:(o[L]!=null&&o[L]!==''?o[L]:(o.en||o.ms||o.zh||'')));
const esc=s=>(s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ZC={'West Coast':'#305088','Interior':'#3A9E5C','East Coast':'#00A3E0','Labuan':'#8A6BBE','Sarawak':'#D9822B'};
const ZORD=['West Coast','Interior','East Coast','Labuan','Sarawak'];
const NAV=['home','about','history','beliefs','organisation','churches','news','resources','contact'];
let DATA=null;
fetch('../data/tjc_locations.geojson',{cache:'no-cache'}).then(r=>r.json()).then(g=>{DATA=g.features.map(f=>f.properties);if(cur==='churches'||cur==='home'||cur==='contact'||cur==='about')route()}).catch(()=>{});
function setLang(l){L=l;try{localStorage.setItem('tjc-lang',l)}catch(e){}document.documentElement.lang={en:'en',ms:'ms',zh:'zh-Hans'}[l];document.body.classList.toggle('zh',l==='zh');chrome();route()}
function chrome(){
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
  document.getElementById('t-banner').textContent=t(C.ui.banner);document.getElementById('t-review').textContent=t(C.ui.review)+' ›';document.getElementById('t-official').textContent=t(C.ui.official)+': ga.tjcsabah.com ↗';
  document.getElementById('t-site').textContent=t(C.ui.site);
  document.querySelectorAll('#topbar [data-k]').forEach(a=>a.textContent=t(C.ui.nav[a.dataset.k]));
  document.getElementById('nav').innerHTML=NAV.map(k=>`<a href="#/${k}" data-p="${k}">${t(C.ui.nav[k])}</a>`).join('');
  document.getElementById('f-site').textContent=t(C.ui.site)+' · '+t(C.ui.sub);
  document.getElementById('f-addr').innerHTML=`${esc(C.contact.addr)}<br>${t(C.ui.phone)}: ${esc(C.contact.phone)}<br><a href="mailto:${C.contact.email}">${C.contact.email}</a>`;
  document.getElementById('f-note').textContent=t(C.ui.footerNote);
  document.getElementById('f-nav1').innerHTML=['about','history','beliefs','organisation'].map(k=>`<div><a href="#/${k}">${t(C.ui.nav[k])}</a></div>`).join('');
  document.getElementById('f-nav2').innerHTML=['churches','news','resources','contact','disclaimer','privacy'].map(k=>`<div><a href="#/${k}">${t(C.ui.nav[k])}</a></div>`).join('');
  document.getElementById('f-proto').textContent=t(C.ui.banner);
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
document.getElementById('burger').onclick=()=>document.getElementById('nav').classList.toggle('open');
let cur='home';
window.addEventListener('hashchange',route);
function route(){const h=(location.hash.replace(/^#\/?/,'')||'home').split('/')[0];cur=PAGES[h]?h:'home';
  document.getElementById('main').innerHTML=PAGES[cur]();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===cur||(cur==='history'&&a.dataset.p==='about'&&false)));
  document.getElementById('nav').classList.remove('open');
  if(AFTER[cur])AFTER[cur]();
  document.title=(cur==='home'?'':t(C.ui.nav[cur]||{en:'What changed'})+' | ')+t(C.ui.site)+' (prototype)';
  if(!location.hash.includes('#/'+cur+'/'))window.scrollTo(0,0)}
const head=(k,p)=>`<div class="page-h"><div class="wrap"><div class="crumb"><a href="#/home">${t(C.ui.nav.home)}</a> › ${t(C.ui.nav[k])}</div><h1>${t(C.ui.nav[k])}</h1>${p?`<p>${p}</p>`:''}</div></div>`;
const ICON={pin:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#00AFF2"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>',
